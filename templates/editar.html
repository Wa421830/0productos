{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-warning">
        <h5 class="mb-0">Modificar Registro: {{ producto.nombre }}</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <h6 class="text-muted border-bottom pb-2">Datos del Catálogo (productos.db)</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Código SKU</label>
                    <input type="text" name="codigo" class="form-control" value="{{ producto.codigo }}" required>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Nombre del Producto</label>
                    <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Categoría</label>
                    <select name="categoria" class="form-select" required>
                        {% for cat in ['Electrónica', 'Alimentos', 'Ferretería', 'Oficina'] %}
                            <option value="{{ cat }}" {% if producto.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Proveedor</label>
                    <select name="proveedor" class="form-select" required>
                        {% for prov in ['Distribuidora Central', 'Importadora Global', 'Suministros del Norte'] %}
                            <option value="{{ prov }}" {% if producto.proveedor == prov %}selected{% endif %}>{{ prov }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Precio Unitario ($)</label>
                    <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
                </div>
            </div>

            <h6 class="text-muted border-bottom pb-2">Control de Existencias (inventario.db)</h6>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Cantidad en Stock</label>
                    <input type="number" name="cantidad" class="form-control" value="{{ inventario.cantidad }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Ubicación / Pasillo</label>
                    <input type="text" name="ubicacion" class="form-control" value="{{ inventario.ubicacion }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Fecha de Ingreso</label>
                    <input type="date" name="fecha_ingreso" class="form-control" value="{{ inventario.fecha_ingreso }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Fecha de Vencimiento</label>
                    <input type="date" name="fecha_vencimiento" class="form-control" value="{{ inventario.fecha_vencimiento }}">
                </div>
            </div>

            <button type="submit" class="btn btn-warning">Actualizar Cambios</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
